<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Golden Image Pipeline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; border-radius: 12px; padding: 2.5rem; width: 360px; border: 1px solid #334155; }
        h1 { color: #ff9900; font-size: 1.4rem; text-align: center; margin-bottom: 0.4rem; }
        p.sub { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 1.6rem; }
        label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-size: 0.9rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; margin-bottom: 1rem; font-size: 0.95rem; }
        .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; background: #ff9900; color: #0f172a; }
        .btn:hover { opacity: 0.9; }
        #msg { margin-top: 1rem; padding: 0.7rem; border-radius: 8px; display: none; font-size: 0.85rem; }
        #msg.error { background: #450a0a; color: #fca5a5; display: block; border: 1px solid #dc2626; }
        #msg.ok { background: #052e16; color: #86efac; display: block; border: 1px solid #16a34a; }
        .hint { color: #64748b; font-size: 0.8rem; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Golden Image Pipeline</h1>
    <p class="sub" id="sub">Sign in to build and manage golden AMIs</p>
    <div id="login-fields">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        <button class="btn" id="btn" onclick="login()">Sign In</button>
    </div>
    <div id="msg"></div>
    <div class="hint" id="hint">Default login: admin / admin &mdash; change it anytime from the <b>Password</b> menu inside the app.</div>
    <div style="text-align:center; color:#475569; font-size:0.7rem; margin-top:1.2rem;">{{ APP_VERSION.marker }}</div>
    <div style="text-align:center; color:#475569; font-size:0.7rem; margin-top:0.4rem;">&copy; 2026 Deepesh Rajpal. All rights reserved.</div>
</div>
<script>
async function login() {
    const msg = document.getElementById('msg');
    msg.className = '';
    msg.style.display = 'none';
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.message || 'Login failed');
        }
        window.location.href = '/';
    } catch (e) {
        msg.className = 'error';
        msg.innerHTML = e.message;
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
}

document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
