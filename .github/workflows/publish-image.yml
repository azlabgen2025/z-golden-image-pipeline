name: publish-image

on:
  push:
    branches: [ main ]
    # Only paths that actually change the published image. The Dockerfile copies
    # web/, config/, the version files and scripts/docker-entrypoint.sh, so a
    # change to any other script — or to documentation — does not need a rebuild.
    # Watching scripts/ wholesale rebuilt and republished the image for edits
    # that were not in the image at all.
    paths:
      - 'web/**'
      - 'config/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/docker-entrypoint.sh'
      - 'VERSION'
      - 'NOTICE'
      - 'LICENSE'
      - 'requirements*.txt'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_VERSION: v0.1.0

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each build gets its own immutable tags so images are reproducible:
      #   latest / v0.1.0            -> floating (newest)
      #   v0.1.0-build-<count>      -> immutable per build number
      #   v0.1.0-<sha>             -> immutable per commit
      - name: Compute build metadata
        id: meta
        run: |
          COUNT="$(git -C . rev-list --count HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "name=${IMAGE_NAME@L}" >> "$GITHUB_OUTPUT"
          echo "build=$COUNT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT" >> "$GITHUB_OUTPUT"

      # Bake the real version into the image (overwrites the tracked placeholder)
      - name: Generate version.json for this build
        run: |
          ./scripts/build-version.sh
          cat web/version.json

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:${{ env.IMAGE_VERSION }}-build-${{ steps.meta.outputs.build }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.name }}:${{ env.IMAGE_VERSION }}-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}

      # Record this build in BUILDS.md so every image maps to its commit
      # and can be rolled back to. Note: appending only on successful push
      # keeps the counter unused builds out of the log.
      - name: Record build in BUILDS.md
        if: steps.build-push.outcome == 'success'
        run: |
          set -euo pipefail
          BUILD="${{ steps.meta.outputs.build }}"
          SHA="${{ steps.meta.outputs.sha }}"
          DATE="$(date +%Y-%m-%d)"
          SUMMARY="$(git log -1 --pretty=%s)"
          VERSION_LINE="$(cat VERSION)"
          ROW="| ${BUILD} | ${VERSION_LINE} | \`${SHA}\` | ${DATE} | \`v${VERSION_LINE}-build-${BUILD}\`, \`v${VERSION_LINE}-${SHA}\` | ${{ steps.build-push.outputs.digest }} | ${SUMMARY} |"
          if grep -q "^| ${BUILD} |" BUILDS.md; then
            echo "Build #${BUILD} already logged; skipping."
            exit 0
          fi
          # Insert the row at the end of the table, immediately after the last
          # existing "|<number>|" row and before any following prose.
          #
          # This deliberately avoids sed: the rows contain '|' characters, so
          # using '|' as the s/// delimiter corrupts the expression, and a
          # previous version appended the row to the end of the file instead
          # (once even gluing it onto a closing code fence, because the file
          # had no trailing newline). awk has no delimiter problem, does not
          # depend on ripgrep being installed, and its END block guarantees the
          # row is never dropped.
          awk -v row="$ROW" '
            BEGIN { seen = 0; inserted = 0 }
            /^\|[[:space:]]*[0-9]+[[:space:]]*\|/ { seen = 1; print; next }
            {
              if (seen && !inserted) { print row; inserted = 1 }
              print
            }
            END { if (!inserted) print row }
          ' BUILDS.md > BUILDS.md.new
          mv BUILDS.md.new BUILDS.md
          git config user.name "golden-pipeline[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BUILDS.md
          git -c commit.gpgsign=false commit -m "docs: log build #${BUILD} (${SHA})" --no-verify
          git push origin HEAD:${GITHUB_REF_NAME}